services:
  - type: web
    name: collegeai-backend
    env: node
    region: oregon
    # rootDir tells Render to cd into server/ before running build and start.
    # This ensures server/package.json is used, not the root package.json.
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: CLIENT_URL
        value: http://localhost:3000
      - key: TOP_K
        value: "5"
      - key: CHUNK_SIZE
        value: "800"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: RELEVANCE_THRESHOLD
        value: "0.1"
